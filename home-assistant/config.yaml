name: "Miele Local Server"
description: "Local encrypted REST API, SSE stream, and Web UI for Miele@home appliances"
version: "1.0.0"
slug: "miele-local-server"
startup: services
boot: auto
init: false
webui: "http://[HOST]:[PORT:5001]"
arch:
  - aarch64
  - amd64
  - armv7
ports:
  5001/tcp: 5001
ports_description:
  5001/tcp: Miele Local Web UI & REST API
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant_config
options:
  purge_history: 30
  home_name: "Miele Local Server"
  log_level: info
  endpoints: []
schema:
  purge_history: int
  home_name: str
  log_level: list(debug|info)
  endpoints:
    - name: str
      host: str
      groupId: str
      groupKey: password
      route: str?
